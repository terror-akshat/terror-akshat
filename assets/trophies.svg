        <animate attributeName="y" values="40;150" dur="4.2s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="536" y="80" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" letter-spacing="3" fill="#8B949E">CLOUD</text>
    <text x="536" y="118" text-anchor="middle" font-family="Fira Code, monospace" font-size="30" font-weight="700" fill="#E3B341">AWS</text>
    <text x="536" y="140" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" letter-spacing="1.5" fill="#6E7681">CERTIFIED</text>
  </g>

  <g>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="12s" begin="1.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 10; 0 10; 0 0; 0 0" keyTimes="0;0.08;0.2;1" dur="12s" begin="1.8s" repeatCount="indefinite"/>
    <rect x="651" y="40" width="197" height="112" rx="10" fill="#161B22" stroke="#F778BA" stroke-width="1.2" stroke-opacity="0.25">
      <animate attributeName="stroke-opacity" values="0.15;0.75;0.15" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="651" y="40" width="197" height="3" fill="#F778BA" opacity="0.85"/>
    <g clip-path="url(#card4)">
      <rect x="651" y="40" width="197" height="2" fill="#F778BA" opacity="0.22">
        <animate attributeName="y" values="40;150" dur="4.2s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="749" y="80" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" letter-spacing="3" fill="#8B949E">LEETCODE</text>
    <text x="749" y="118" text-anchor="middle" font-family="Fira Code, monospace" font-size="30" font-weight="700" fill="#F778BA">700+</text>
    <text x="749" y="140" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" letter-spacing="1.5" fill="#6E7681">PROBLEMS SOLVED</text>
  </g>
